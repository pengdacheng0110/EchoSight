name: 打包 Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# softprops/action-gh-release 需要写 Release 的权限。
# 新建仓库的 GITHUB_TOKEN 默认是只读的，不显式声明会在打 tag 时失败。
permissions:
  contents: write

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 从仓库 Secrets 注入，Key 不会出现在日志里
      SENSEAUDIO_API_KEY: ${{ secrets.SENSEAUDIO_API_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 先挡住"Key 没配"，否则会打出一个能装但语音完全不可用的 APK
      - name: 检查语音接口 Key
        run: |
          if [ -z "$SENSEAUDIO_API_KEY" ]; then
            echo "::error title=缺少 SENSEAUDIO_API_KEY::仓库没有配置 SENSEAUDIO_API_KEY 这个 Secret。"
            echo "### ❌ 缺少 SENSEAUDIO_API_KEY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "没有它，打出来的 APK 无法使用云端语音（TTS/ASR）。" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**配置方法**：仓库 Settings → Secrets and variables → Actions → New repository secret，" >> "$GITHUB_STEP_SUMMARY"
            echo "名称填 \`SENSEAUDIO_API_KEY\`，值填 SenseAudio 的 Key（\`sk-\` 开头），然后重新运行本工作流。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "SENSEAUDIO_API_KEY 已配置（长度 ${#SENSEAUDIO_API_KEY}）"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 必须缓存签名密钥，否则每次 CI 的产物都装不上上一版。
      #
      # release 用的是 signingConfigs.getByName("debug")，而 debug keystore 由
      # Gradle 在首次构建时自动生成到 ~/.android/debug.keystore。runner 是全新的，
      # 不缓存就等于每次 CI 换一把新密钥 —— 实测第 4 轮和第 7 轮产物的证书摘要
      # 完全不同（4cde784c… vs 05c12915…）。
      # Android 要求覆盖安装时签名一致，签名一变系统就报"应用未安装"，
      # 用户只能先卸载（应用数据全丢）再装新的。下载几轮 APK 一定会撞上。
      #
      # key 用固定值（不带 SHA）：这样缓存跨提交长期复用，只在 GitHub 淘汰
      # 缓存后才会重新生成一次密钥。
      - name: 缓存调试签名密钥
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 把产物改成带版本号和短 SHA 的名字，下载下来一眼能认出版本
      - name: 整理产物
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          sha=$(git rev-parse --short=7 HEAD)
          name="EchoSight-${sha}.apk"
          cp "$src" "dist/$name"
          size=$(du -h "dist/$name" | cut -f1)

          # 打印签名证书摘要：比对两次构建的这一行就能确认签名是否稳定。
          # 摘要变了 = 覆盖安装会失败（系统报"应用未安装"），说明密钥缓存没生效。
          # 整段用 if 包住，apksigner 找不到也不能让构建失败。
          cert="未知"
          bt=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$bt" ] && [ -x "$bt/apksigner" ]; then
            cert=$("$bt/apksigner" verify --print-certs "dist/$name" 2>/dev/null \
              | grep -m1 'SHA-256 digest' | sed 's/.*: //' || true)
            cert=${cert:-未知}
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "### ✅ 打包成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 文件 | \`$name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 大小 | $size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 提交 | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 签名证书 SHA-256 | \`${cert:0:16}…\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 安装新版本时若提示「应用未安装」，说明签名和已装的那份不一致 ——" >> "$GITHUB_STEP_SUMMARY"
          echo "> 先卸载旧版再装。上面的证书摘要每次构建都应相同。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在本页底部 **Artifacts** 区下载 \`EchoSight-apk\`。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK（本页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: EchoSight-apk
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 发布到 Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
