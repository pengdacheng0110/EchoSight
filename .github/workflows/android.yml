name: 打包 Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# softprops/action-gh-release 需要写 Release 的权限。
# 新建仓库的 GITHUB_TOKEN 默认是只读的，不显式声明会在打 tag 时失败。
permissions:
  contents: write

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 从仓库 Secrets 注入，Key 不会出现在日志里
      SENSEAUDIO_API_KEY: ${{ secrets.SENSEAUDIO_API_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 先挡住"Key 没配"，否则会打出一个能装但语音完全不可用的 APK
      - name: 检查语音接口 Key
        run: |
          if [ -z "$SENSEAUDIO_API_KEY" ]; then
            echo "::error title=缺少 SENSEAUDIO_API_KEY::仓库没有配置 SENSEAUDIO_API_KEY 这个 Secret。"
            echo "### ❌ 缺少 SENSEAUDIO_API_KEY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "没有它，打出来的 APK 无法使用云端语音（TTS/ASR）。" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**配置方法**：仓库 Settings → Secrets and variables → Actions → New repository secret，" >> "$GITHUB_STEP_SUMMARY"
            echo "名称填 \`SENSEAUDIO_API_KEY\`，值填 SenseAudio 的 Key（\`sk-\` 开头），然后重新运行本工作流。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "SENSEAUDIO_API_KEY 已配置（长度 ${#SENSEAUDIO_API_KEY}）"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 签名密钥固定在仓库里（android/keystore/sideload.jks），
      # 不再依赖 Gradle 自动生成的 ~/.android/debug.keystore。
      #
      # 之前 release 用的是 signingConfigs.getByName("debug")，而 debug keystore
      # 由 Gradle 首次构建时随机生成，runner 又是全新机器 —— 于是每轮 CI 都换一把
      # 新密钥。实测同一个提交 fc17252 连续构建，证书摘要依次是
      # 4cde784c… / 05c12915… / b4456d77… / 7426bf8f…，而 APK 大小完全一样
      # （46240722 字节），只有签名不同。
      # Android 覆盖安装要求签名一致，签名一变系统就报"应用未安装"，
      # 用户只能先卸载（应用数据全丢）再装新版。
      #
      # 也试过用 actions/cache 缓存 ~/.android/debug.keystore，但那个路径并不存在
      # （日志报 "Path(s) ... do(es) not exist, hence no cache is being saved"），
      # 而且缓存会被 GitHub 淘汰 —— 都不如把密钥放进仓库可靠。

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 把产物改成带版本号和短 SHA 的名字，下载下来一眼能认出版本
      - name: 整理产物
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          sha=$(git rev-parse --short=7 HEAD)
          name="EchoSight-${sha}.apk"
          cp "$src" "dist/$name"
          size=$(du -h "dist/$name" | cut -f1)

          # 仓库内固定密钥的证书指纹。这一行每次构建都应该是同一个值；
          # 对不上就说明签名配置没生效，覆盖安装会失败（系统报"应用未安装"）。
          EXPECT="d376a48566801edd47a4206c0d28dd9b57ca6989eb58b880a67fa1882f5372b5"
          cert="未知"
          bt=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$bt" ] && [ -x "$bt/apksigner" ]; then
            cert=$("$bt/apksigner" verify --print-certs "dist/$name" 2>/dev/null \
              | grep -m1 'SHA-256 digest' | sed 's/.*: //' || true)
            cert=${cert:-未知}
          fi

          # 找不到 apksigner 只告警，不让构建失败；但只要读到了证书，就必须对得上。
          if [ "$cert" = "未知" ]; then
            echo "::warning title=未能读取签名::没找到 apksigner，跳过签名校验"
          elif [ "$cert" = "$EXPECT" ]; then
            echo "签名证书与仓库内固定密钥一致"
          else
            echo "::error title=签名证书不一致::期望 ${EXPECT:0:16}…，实际 ${cert:0:16}…，覆盖安装会失败。"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "### ✅ 打包成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 文件 | \`$name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 大小 | $size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 提交 | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 签名证书 SHA-256 | \`${cert:0:16}…\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 签名固定用仓库内的 \`android/keystore/sideload.jks\`，各次构建一致，" >> "$GITHUB_STEP_SUMMARY"
          echo "> 可以直接覆盖安装旧版本，不必先卸载。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在本页底部 **Artifacts** 区下载 \`EchoSight-apk\`。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK（本页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: EchoSight-apk
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 发布到 Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
